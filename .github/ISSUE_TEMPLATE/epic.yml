name: Epic (프로젝트 명세)
description: 신규 프로젝트 / 큰 작업 단위 — 명세 + 하위 이슈를 묶는 컨테이너
title: "[Epic] "
type: Epic
body:
  - type: markdown
    attributes:
      value: |
        Epic은 여러 하위 이슈(Bug/Feature/Chore/Task)를 묶는 **명세 + 트래킹 단위**입니다.
        작성 시점에 모든 항목을 다 채울 필요는 없습니다. 명세가 구체화되면 업데이트하세요.

  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 이 Epic이 달성하려는 것. **왜** 하는지가 명확하게.
      placeholder: "예: 회원가입 플로우를 새로 만들어 전환율 15% 개선"
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 배경 / 문제 정의
      description: 현재 상황, 풀고자 하는 문제, 의사결정 맥락.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 범위 (Scope)
      description: 이번 Epic에 포함되는 것 / 제외되는 것.
      value: |
        **포함 (In-scope):**
        - 
        - 

        **제외 (Out-of-scope):**
        - 
    validations:
      required: true

  - type: textarea
    id: success
    attributes:
      label: 성공 기준 (Definition of Done)
      description: 어떤 상태가 되면 이 Epic이 "끝났다"고 판단할지. 측정 가능하면 좋음.
      value: |
        - [ ]
        - [ ]
        - [ ]

  - type: textarea
    id: breakdown
    attributes:
      label: 작업 분해 (하위 이슈)
      description: Epic을 구성하는 하위 작업들. 작성하면서 채워가도 되고, 나중에 이슈 만들면서 링크해도 됩니다.
      value: |
        - [ ] #
        - [ ] #
        - [ ] #

  - type: input
    id: stakeholders
    attributes:
      label: 이해관계자
      placeholder: "@username, @username2"

  - type: input
    id: timeline
    attributes:
      label: 예상 일정 / 마일스톤
      placeholder: "예: 2026 Q2 / 또는 GitHub Milestone 링크"

  - type: textarea
    id: notes
    attributes:
      label: 참고 자료 / 링크
      description: 디자인, 설계 문서, 관련 이슈, 외부 자료 등.
