name: 📨 PR (프로젝트 요청)
description: 작업 위치/세부 분해가 불확실할 때 일단 요청을 기록. 적절한 repo로 transfer 후 진행.
title: "[PR] "
type: PR
body:
  - type: markdown
    attributes:
      value: |
        💡 **사용 시점**
        - 작업 위치 미정이면 → application-epic 에 작성, Backend Lead가 적절한 repo로 transfer
        - 작업 위치 명확하면 → 그 repo에서 바로 작성

  - type: textarea
    id: what
    attributes:
      label: 무엇을 요청하나요?
      description: 원하는 결과 / 기능 (PM 시각)
      placeholder: "예: 회원가입 시 카카오톡 인증 옵션 추가"
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 배경 / 왜 필요한가
      description: 풀고자 하는 문제 또는 기대 효과
    validations:
      required: true

  - type: input
    id: related_epic
    attributes:
      label: 관련 Epic
      description: "application-epic 의 Epic 이슈 번호 또는 URL (해당 시)"
      placeholder: "wirobotics/application-epic#5"

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - 긴급 (이번 주)
        - 높음 (이번 스프린트)
        - 보통 (다음 스프린트)
        - 낮음 (백로그)

  - type: input
    id: timeline
    attributes:
      label: 예상 일정
      placeholder: "예: 2026 Q2 / 또는 GitHub Milestone 링크"

  - type: textarea
    id: notes
    attributes:
      label: 참고 자료 / 링크
      description: 디자인, 명세 문서, 관련 이슈 등
