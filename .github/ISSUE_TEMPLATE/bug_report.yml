name: 🐛 버그 신고
description: 버그를 신고합니다
title: "[Bug] "
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        버그 신고 전 확인:
        - 비슷한 이슈가 이미 있지 않은지 검색해주세요.
        - 재현 가능한 정보를 최대한 자세히 적어주세요.

  - type: textarea
    id: summary
    attributes:
      label: 무엇이 발생했나요?
      description: 현재 동작과 기대 동작을 적어주세요.
      placeholder: |
        - 현재: 로그인 버튼 클릭 시 무반응
        - 기대: 대시보드로 이동
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      description: 다른 사람이 재현할 수 있는 순서대로 적어주세요.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 환경
      placeholder: "예: macOS 14 / Chrome 120 / app v1.2.3"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 로그 / 스크린샷
      description: 관련 로그나 스크린샷이 있으면 첨부해주세요.
      render: shell
