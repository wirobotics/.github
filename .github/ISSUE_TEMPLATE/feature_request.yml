name: ✨ Feature (기능 개발)
description: 새 기능 또는 개선을 제안합니다
title: "[Feature] "
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제를 해결하나요?
      description: 기능 자체가 아니라 **사용자가 겪는 문제**를 적어주세요.
      placeholder: "예: 사용자가 X를 하려면 매번 Y를 해야 해서 불편함"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결책
      description: 어떻게 풀고 싶은지 적어주세요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 대안 / 고려한 다른 방법
      description: 다른 접근이 있었다면 적어주세요. (없으면 비워둬도 됨)

  - type: checkboxes
    id: scope
    attributes:
      label: 영향 범위
      description: 이 기능이 닿는 영역을 선택해주세요. (라벨 부여 참고용)
      options:
        - label: Frontend
        - label: Backend
        - label: App
        - label: Design
        - label: Product (기획)
        - label: 데이터/마이그레이션 필요
        - label: 외부 API 변경
