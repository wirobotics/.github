name: Sync App Project

on:
  schedule:
    - cron: '0 * * * *'   # 매 시간 정각
  workflow_dispatch:
    inputs:
      full_sync:
        description: '전체 sync (모든 이슈 다시 처리). 비활성화면 최근 3시간 변경된 것만'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync issues (incremental or full) to Application Part Board
        env:
          GH_TOKEN: ${{ secrets.LABEL_SEED_TOKEN }}
          FULL_SYNC: ${{ inputs.full_sync || 'false' }}
        run: |
          set -euo pipefail
          PROJECT_NUMBER=6
          PROJECT_ID="PVT_kwDOB5DVVs4BYQYX"
          ORG=wirobotics

          if [ -z "$GH_TOKEN" ]; then
            echo "❌ LABEL_SEED_TOKEN secret not set."
            exit 1
          fi

          # Status field + Done option ID 조회
          STATUS_INFO=$(gh api graphql -f query='
            query {
              organization(login: "wirobotics") {
                projectV2(number: 6) {
                  field(name: "Status") {
                    ... on ProjectV2SingleSelectField {
                      id
                      options { id name }
                    }
                  }
                }
              }
            }')
          STATUS_FIELD_ID=$(echo "$STATUS_INFO" | jq -r '.data.organization.projectV2.field.id')
          DONE_OPTION_ID=$(echo "$STATUS_INFO" | jq -r '.data.organization.projectV2.field.options[] | select(.name=="Done") | .id')

          # 시간 필터 설정
          if [ "$FULL_SYNC" = "true" ]; then
            SEARCH_FILTER=""
            echo "🌐 FULL SYNC mode — 모든 이슈 처리"
          else
            # 3시간 lookback (시스템 장애 대비 buffer)
            CUTOFF=$(date -u -d '3 hours ago' +%FT%TZ 2>/dev/null || date -u -v-3H +%FT%TZ)
            SEARCH_FILTER="updated:>=$CUTOFF"
            echo "⚡ INCREMENTAL mode — 최근 3시간 변경분만"
            echo "   cutoff: $CUTOFF"
          fi
          echo ""

          echo "🔍 Finding repos with topic 'application'..."
          repos=$(gh search repos --owner "$ORG" --topic application --limit 100 --json fullName -q '.[].fullName')
          repo_count=$(echo "$repos" | wc -l | tr -d ' ')
          echo "Found $repo_count repos"
          echo ""

          for repo in $repos; do
            # incremental: --search 로 필터, full: 전체
            if [ -n "$SEARCH_FILTER" ]; then
              raw=$(gh issue list -R "$repo" --state all --limit 500 --search "$SEARCH_FILTER" --json url,state 2>/dev/null || echo '[]')
            else
              raw=$(gh issue list -R "$repo" --state all --limit 500 --json url,state)
            fi

            issue_count=$(echo "$raw" | jq 'length')
            printf "═══ %s (%s issues)\n" "$repo" "$issue_count"
            [ "$issue_count" = "0" ] && continue

            echo "$raw" | jq -r '.[] | "\(.state)|\(.url)"' \
              | while IFS='|' read -r state url; do
                  ITEM_ID=$(gh project item-add "$PROJECT_NUMBER" --owner "$ORG" --url "$url" --format json | jq -r '.id')

                  if [ "$state" = "CLOSED" ]; then
                    gh api graphql -f query="
                      mutation {
                        updateProjectV2ItemFieldValue(input: {
                          projectId: \"$PROJECT_ID\"
                          itemId: \"$ITEM_ID\"
                          fieldId: \"$STATUS_FIELD_ID\"
                          value: { singleSelectOptionId: \"$DONE_OPTION_ID\" }
                        }) { projectV2Item { id } }
                      }" >/dev/null
                    echo "  ✓ $url [Done]"
                  else
                    echo "  ✓ $url [open]"
                  fi
                done
          done

          echo ""
          echo "✨ Done. (mode: $([ "$FULL_SYNC" = "true" ] && echo "FULL" || echo "INCREMENTAL 3h"))"
