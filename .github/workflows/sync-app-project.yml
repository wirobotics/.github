name: Sync App Project

on:
  schedule:
    - cron: '0 * * * *'   # 매 시간 정각
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync all issues (open + closed) to Application Part Board
        env:
          GH_TOKEN: ${{ secrets.LABEL_SEED_TOKEN }}
        run: |
          set -euo pipefail
          PROJECT_NUMBER=6
          PROJECT_ID="PVT_kwDOB5DVVs4BYQYX"
          ORG=wirobotics

          if [ -z "$GH_TOKEN" ]; then
            echo "❌ LABEL_SEED_TOKEN secret not set."
            exit 1
          fi

          # Status 필드와 Done 옵션 ID 조회 (resilient: ID 바뀌어도 동작)
          STATUS_INFO=$(gh api graphql -f query='
            query {
              organization(login: "wirobotics") {
                projectV2(number: 6) {
                  field(name: "Status") {
                    ... on ProjectV2SingleSelectField {
                      id
                      options { id name }
                    }
                  }
                }
              }
            }')
          STATUS_FIELD_ID=$(echo "$STATUS_INFO" | jq -r '.data.organization.projectV2.field.id')
          DONE_OPTION_ID=$(echo "$STATUS_INFO" | jq -r '.data.organization.projectV2.field.options[] | select(.name=="Done") | .id')

          echo "📐 Status field: $STATUS_FIELD_ID"
          echo "✓ Done option: $DONE_OPTION_ID"
          echo ""

          echo "🔍 Finding repos with topic 'application'..."
          repos=$(gh search repos --owner "$ORG" --topic application --limit 100 --json fullName -q '.[].fullName')
          repo_count=$(echo "$repos" | wc -l | tr -d ' ')
          echo "Found $repo_count repos"
          echo ""

          for repo in $repos; do
            issue_count=$(gh issue list -R "$repo" --state all --limit 500 --json url -q 'length')
            printf "═══ %s (%s issues)\n" "$repo" "$issue_count"
            [ "$issue_count" = "0" ] && continue

            gh issue list -R "$repo" --state all --limit 500 --json url,state \
              | jq -r '.[] | "\(.state)|\(.url)"' \
              | while IFS='|' read -r state url; do
                  # 이슈를 Project에 추가 (멱등 — 이미 있으면 기존 item 반환)
                  ITEM_ID=$(gh project item-add "$PROJECT_NUMBER" --owner "$ORG" --url "$url" --format json | jq -r '.id')

                  if [ "$state" = "CLOSED" ]; then
                    # closed 이슈는 Status=Done 으로 설정 (멱등)
                    gh api graphql -f query="
                      mutation {
                        updateProjectV2ItemFieldValue(input: {
                          projectId: \"$PROJECT_ID\"
                          itemId: \"$ITEM_ID\"
                          fieldId: \"$STATUS_FIELD_ID\"
                          value: { singleSelectOptionId: \"$DONE_OPTION_ID\" }
                        }) { projectV2Item { id } }
                      }" >/dev/null
                    echo "  ✓ $url [Done]"
                  else
                    echo "  ✓ $url [open]"
                  fi
                done
          done

          echo ""
          echo "✨ Done."
