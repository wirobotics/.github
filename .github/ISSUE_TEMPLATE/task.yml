name: 📋 Task (일반 작업)
description: "Bug / Feature / Chore에 속하지 않는 일반 작업 (예: Epic 하위 작업, 조사, 결정사항)"
title: "[Task] "
type: Task
body:
  - type: textarea
    id: description
    attributes:
      label: 작업 내용
      description: 무엇을 해야 하는지 적어주세요.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 배경 / 목적
      description: 왜 이 작업이 필요한지 (상위 Epic, 관련 의사결정 등).

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건 (Definition of Done)
      description: 어떤 상태가 되면 이 작업이 끝난 건가요?
      value: |
        - [ ]
        - [ ]
        - [ ]

  - type: textarea
    id: notes
    attributes:
      label: 참고사항 / 링크
      description: 관련 이슈, 문서, 디자인 링크 등.
